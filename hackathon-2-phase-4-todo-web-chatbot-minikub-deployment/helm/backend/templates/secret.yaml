{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.secretName" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded secrets
  # Note: These are example values. Override in production with actual secrets
  database-url: {{ .Values.config.dbUrl | b64enc }}
  database-url-async: {{ .Values.config.dbUrlAsync | default .Values.config.dbUrl | b64enc }}
  jwt-secret: {{ .Values.env.JWT_SECRET_KEY | b64enc | quote }}
  openai-api-key: {{ .Values.env.OPENAI_API_KEY | b64enc | quote }}
{{- end }}
