# Default values for frontend Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

config:
  dbUrl: "postgresql://neondb_owner:npg_6M0itvWfPqQp@ep-silent-smoke-a5p67vuo-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require"
  
# Number of frontend pod replicas
replicaCount: 2

# Docker image configuration
image:
  repository: frontend
  pullPolicy: IfNotPresent  # Use Never for Minikube, IfNotPresent for registry
  tag: "latest"

# Image pull secrets for private registries (if needed)
imagePullSecrets: []

# Override name
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}
  # fsGroup: 2000

# Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true

# Kubernetes Service configuration
service:
  type: NodePort  # NodePort for Minikube access, LoadBalancer for cloud
  port: 3000
  targetPort: 3000
  nodePort: 30000  # Fixed port for Minikube (30000-32767 range)
  # annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: flowtask.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: flowtask-tls
  #    hosts:
  #      - flowtask.local

# Resource limits and requests
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Health check configuration
healthCheck:
  liveness:
    enabled: true
    path: /
    port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    path: /
    port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

# Environment variables
env:
  # Backend API URL (should point to backend service)
  # Format: http://SERVICE_NAME:PORT
  # For same namespace: http://backend-backend-service:8000
  # For cross-namespace: http://backend-backend-service.namespace.svc.cluster.local:8000
  NEXT_PUBLIC_API_URL: "http://backend-backend-service:8000"

# ConfigMap configuration
configMap:
  enabled: true
  name: frontend-config
  # If using external configmap, set to false
  create: true

# Pod disruption budget (for high availability)
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Additional labels
labels: {}

# Additional environment variables from existing secrets/configmaps
envFrom: []
  # - configMapRef:
  #     name: external-config
  # - secretRef:
  #     name: external-secret


