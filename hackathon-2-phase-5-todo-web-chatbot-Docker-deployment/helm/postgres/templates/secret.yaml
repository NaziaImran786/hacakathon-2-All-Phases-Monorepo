{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.secretName" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded password
  # Note: This is an example value. Override in production with actual password
  password: {{ .Values.postgresql.password | b64enc | quote }}
{{- end }}
